# Deploy static site to GitHub Pages (no build step).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Decode base64 APKs (apk/*.apk.b64 -> apk/*.apk)
        run: |
          for f in apk/*.apk.b64; do [ -e "$f" ] || continue; base64 -d "$f" > "${f%.b64}" && rm "$f"; done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Site root (exclude .git via checkout; no node_modules in this project)
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
